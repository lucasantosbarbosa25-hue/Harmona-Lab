[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "harmona-lab"
version = "0.1.0"
description = "Laboratório de voicings, reharmonização e condução de vozes que gera MIDI exato."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mido>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
harmonalab = "harmonalab.cli:main"

[tool.setuptools]
packages = ["harmonalab"]

[tool.setuptools.package-data]
harmonalab = ["web/*", "web/engine/*", "web/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
